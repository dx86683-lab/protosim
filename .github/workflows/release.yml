name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    # Keep the dynamically linked Linux amd64 build on the Ubuntu 24.04 runtime baseline.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Determine release version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Build embedded Vue 3 frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Install libpcap-dev (for linux/amd64 packet capture)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Run Go tests
        run: go test ./internal/... ./cmd/...

      - name: Build release binaries
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p release
          LDFLAGS="-s -w -X main.Version=${VERSION}"

          # 1. linux/amd64 (full build with libpcap cgo support)
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o release/protosim ./cmd/protosim
          tar -czf "release/protosim-${TAG}-linux-amd64.tar.gz" -C release protosim -C ../deploy/systemd protosim.service
          rm -f release/protosim

          # 2. Cross-platform pure-Go builds (CGO_ENABLED=0)
          curl -fsSL https://www.wintun.net/builds/wintun-0.14.1.zip -o release/wintun.zip
          unzip -q -o release/wintun.zip wintun/bin/amd64/wintun.dll -d release
          mv release/wintun/bin/amd64/wintun.dll release/wintun.dll
          rm -rf release/wintun release/wintun.zip

          for target in "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=""
            [ "${GOOS}" = "windows" ] && EXT=".exe"
            BIN="protosim${EXT}"

            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -ldflags "${LDFLAGS}" -o "release/${BIN}" ./cmd/protosim
            if [ "${GOOS}" = "windows" ]; then
              (cd release && zip -q "protosim-${TAG}-${GOOS}-${GOARCH}.zip" "${BIN}" wintun.dll)
              rm -f release/wintun.dll
            elif [ "${GOOS}" = "linux" ]; then
              tar -czf "release/protosim-${TAG}-${GOOS}-${GOARCH}.tar.gz" -C release "${BIN}" -C ../deploy/systemd protosim.service
            else
              tar -czf "release/protosim-${TAG}-${GOOS}-${GOARCH}.tar.gz" -C release "${BIN}"
            fi
            rm -f "release/${BIN}"
          done

          (cd release && sha256sum *.tar.gz *.zip > checksums.txt)
          ls -lh release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "ProtoSim ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/checksums.txt
